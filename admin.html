<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Portal | Temba Ncetani</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="music-style.css">
    <style>
        .login-box { max-width: 400px; margin: 150px auto; background: #0c2414; padding: 40px; border-radius: 10px; border-top: 5px solid var(--accent-green); text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.8); }
        .login-box h2 { color: var(--accent-green); margin-bottom: 20px; font-family: var(--font-heading); }
        .login-box input { width: 100%; padding: 15px; margin-bottom: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(197, 160, 89, 0.3); color: white; border-radius: 5px; }
        
        .admin-dashboard { display: none; max-width: 800px; margin: 100px auto; background: #0c2414; padding: 40px; border-radius: 10px; border-top: 5px solid var(--accent-green); box-shadow: 0 15px 40px rgba(0,0,0,0.8); }
        .admin-dashboard h2 { color: var(--accent-green); margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; color: white; margin-bottom: 8px; font-weight: bold; }
        .form-group input { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(197, 160, 89, 0.3); color: white; border-radius: 5px; }
        
        .event-item { display: flex; justify-content: space-between; align-items: center; background: #050505; padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--accent-green); color: white; }
        .event-item img { width: 90px; border-radius: 5px; }
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } 100% { transform: translateX(0); } }
    </style>
</head>
<body style="background-color: var(--bg-darker);">

    <header>
        <div class="logo">Artist Portal</div>
        <nav>
            <a href="index.html">← Back to Website</a>
        </nav>
    </header>

    <!-- LOGIN SCREEN -->
    <div class="login-box" id="loginScreen">
        <h2>Artist Portal</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Authorized Access Only</p>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Enter Secure Password">
        <button class="btn btn-green" style="width: 100%;" onclick="checkLogin()">Login</button>
        <p id="error-msg" style="color: #e74c3c; margin-top: 15px; display: none;">Incorrect email or password</p>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div class="admin-dashboard" id="adminDashboard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2>Manage Upcoming Shows</h2>
            <button onclick="logout()" style="background: #333; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer;">Logout</button>
        </div>

        <div class="form-group">
            <label>Show Flyer</label>
            <input type="file" id="flyer" accept="image/*">
        </div>
        
        <button class="btn btn-green" style="width: 100%; margin-bottom: 40px;" onclick="addFlyer()">Add Flyer to Website</button>

        <hr style="border: 1px solid #333; margin-bottom: 20px;">
        <h3 style="color: var(--accent-green); margin-bottom: 15px;">Current Live Shows</h3>
        <div id="eventList"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://hjwuwwbebsbhrjytcjqv.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_SlgiM37enHi4X5DpsFzyLQ_qvqQ-K8K";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showDashboard(show) {
            document.getElementById("adminDashboard").style.display = show ? "block" : "none";
            document.getElementById("loginScreen").style.display = show ? "none" : "block";
            if (show) loadFlyers();
        }

        async function checkLogin() {
            var result = await db.auth.signInWithPassword({
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            });
            if (result.error) {
                var box = document.getElementById("loginScreen");
                var message = document.getElementById("error-msg");
                message.style.display = "block";
                box.classList.add("shake");
                setTimeout(function() { box.classList.remove("shake"); }, 500);
                return;
            }
            document.getElementById("error-msg").style.display = "none";
            document.getElementById("password").value = "";
            showDashboard(true);
        }

        async function logout() {
            await db.auth.signOut();
            showDashboard(false);
        }

        async function addFlyer() {
            var input = document.getElementById("flyer");
            var file = input.files[0];
            if (!file) { alert("Please choose a flyer first."); return; }
            var name = Date.now() + "-" + file.name.replace(/[^a-zA-Z0-9.]/g, "_");
            var result = await db.storage.from("flyers").upload(name, file);
            if (result.error) { alert("Upload failed: " + result.error.message); return; }
            input.value = "";
            alert("Flyer added! It is now live on the website.");
            loadFlyers();
        }

        async function loadFlyers() {
            var list = document.getElementById("eventList");
            var result = await db.storage.from("flyers").list("", { limit: 100, sortBy: { column: "name", order: "desc" } });
            list.innerHTML = "";
            if (result.error) { list.textContent = "Could not load flyers: " + result.error.message; return; }
            var files = result.data.filter(function(f) { return !f.name.startsWith("."); });
            if (files.length === 0) { list.innerHTML = "<p style='color: #aaa;'>No upcoming shows listed.</p>"; return; }

            files.forEach(function(file) {
                var div = document.createElement("div");
                div.className = "event-item";
                var img = document.createElement("img");
                img.src = db.storage.from("flyers").getPublicUrl(file.name).data.publicUrl;
                img.alt = "Show flyer";
                var button = document.createElement("button");
                button.className = "delete-btn";
                button.textContent = "Delete";
                button.onclick = function() { deleteFlyer(file.name); };
                div.append(img, button);
                list.appendChild(div);
            });
        }

        async function deleteFlyer(name) {
            if (!confirm("Are you sure you want to delete this flyer?")) return;
            var result = await db.storage.from("flyers").remove([name]);
            if (result.error) alert("Delete failed: " + result.error.message);
            loadFlyers();
        }

        db.auth.getSession().then(function(result) {
            if (result.data.session) showDashboard(true);
        });
    </script>
</body>
</html>
