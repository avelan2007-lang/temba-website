<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Shows | Temba Ncetani</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="music-style.css">
</head>
<body>

    <!-- NAVIGATION -->
    <header>
        <div class="logo">Temba Ncetani</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#music">Music</a>
            <a href="index.html#video">Watch</a>
            <a href="biography.html">Biography</a>
            <a href="shows.html" class="active">Shows</a>
            <a href="index.html#bookings">Bookings</a>
        </nav>
    </header>

    <!-- PAGE HEADER -->
    <section class="hero" style="height: 50vh; background-image: linear-gradient(rgba(5, 5, 5, 0.8), rgba(5, 5, 5, 0.95)), url('images/live1.jpg');">
        <h1>Live & In Session</h1>
        <p>Catch Temba Ncetani performing live at a stage near you.</p>
    </section>

    <!-- UPCOMING SHOWS SECTION -->
    <section class="shows-section" id="shows" style="background-color: var(--bg-dark); min-height: 50vh;">
        <h2 class="section-title">Upcoming Performances</h2>
        
        <div style="max-width: 800px; margin: 0 auto;" id="publicEventList">
            <!-- Javascript will load the events here -->
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Temba Ncetani. All Rights Reserved.</p>
        <p style="margin-top: 10px;">
            <a href="https://www.instagram.com/temba_ncetani" target="_blank">Instagram</a> | 
            <a href="https://www.facebook.com/sinetembabassicks.ncetani" target="_blank">Facebook</a> | 
            <a href="https://youtu.be/SeePaEPt-s8" target="_blank">YouTube</a>
        </p>
    </footer>

    <!-- FLOATING JAZZ MUSIC PLAYER -->
    <audio id="bg-music" loop>
        <source src="images/jazz-vibe.mp3" type="audio/mpeg">
    </audio>

    <button id="music-btn" class="music-btn" onclick="toggleMusic()">
        <span id="music-text">Play Jazz Vibe</span>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // --- SUPABASE KEYS ---
        const SUPABASE_URL = "https://hjwuwwbebsbhrjytcjqv.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_SlgiM37enHi4X5DpsFzyLQ_qvqQ-K8K";

        // --- JAZZ MUSIC PLAYER LOGIC ---
        var audio = document.getElementById("bg-music");
        var btn = document.getElementById("music-btn");
        var text = document.getElementById("music-text");
        var isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                btn.classList.remove("playing");
                text.innerText = "Play Jazz Vibe";
                isPlaying = false;
            } else {
                audio.play();
                btn.classList.add("playing");
                text.innerText = "Pause Music";
                isPlaying = true;
            }
        }

        // --- LOAD SHOW FLYERS ---
        window.addEventListener('load', async function() {
            var list = document.getElementById("publicEventList");
            try {
                var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                var result = await db.storage.from("flyers").list("", { limit: 100, sortBy: { column: "name", order: "desc" } });
                if (result.error) throw result.error;
                var files = result.data.filter(function(f) { return !f.name.startsWith("."); });

                if (files.length === 0) {
                    list.innerHTML = "<p style='text-align: center; color: var(--text-muted); font-size: 1.2rem;'>No upcoming shows at the moment. Check back soon!</p>";
                    return;
                }

                files.forEach(function(file) {
                    var img = document.createElement("img");
                    img.src = db.storage.from("flyers").getPublicUrl(file.name).data.publicUrl;
                    img.alt = "Show flyer";
                    img.style = "display: block; width: 100%; margin-bottom: 20px; border-radius: 8px;";
                    list.appendChild(img);
                });
            } catch (error) {
                console.error(error);
                list.innerHTML = "<p style='text-align: center; color: var(--text-muted); font-size: 1.2rem;'>Could not load shows. Please try again later.</p>";
            }
        });
    </script>
</body>
</html>
